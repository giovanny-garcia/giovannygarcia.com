name: Site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - package.json
      - package-lock.json
      - .github/workflows/site.yml
  pull_request:
    paths:
      - apps/site/**
      - package.json
      - package-lock.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/site/dist
          cname: giovannygarcia.com
